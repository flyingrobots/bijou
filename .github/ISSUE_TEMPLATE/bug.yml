name: Bug report
description: Report a Bijou defect or regression with reproduction evidence.
labels:
  - lane:inbox
  - type:bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal commands, repo state, and inputs needed to reproduce.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime, terminal, and operating system context.
      value: |
        - Package:
        - Version or commit:
        - Node.js:
        - Terminal:
        - OS:
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is blocked or misled by this?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: expected-evidence
    attributes:
      label: Expected evidence
      description: Name the reproduction, tests, transcript, or artifact that proves the result.
    validations:
      required: true
