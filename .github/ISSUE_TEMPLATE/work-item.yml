name: Work item
description: One observable outcome with scope and acceptance checks.
body:
  - type: markdown
    attributes:
      value: |
        GitHub issues and milestones own roadmap and release scope. Linear execution migration is pending connection and workspace/team selection. Link existing tracker items rather than duplicating work.
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
      description: Describe the observable problem and its source or reproduction.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: Name one coherent outcome and what remains outside it.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: State the behavior or result that proves completion.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Name relevant tests or documentation checks and expected results.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Prerequisites and links
      description: Link prerequisite issues with reasons, the release milestone, Linear counterpart, design record, and PR where applicable.
