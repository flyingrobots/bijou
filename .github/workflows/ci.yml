name: CI

on:
  push:
    branches: [main]
    tags: [ "v*.*.*", "v*.*.*-*" ]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      dogfood: ${{ steps.dogfood.outputs.dogfood }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Classify DOGFOOD relevance
        id: dogfood
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "dogfood=true" >> "$GITHUB_OUTPUT"
            echo "DOGFOOD CI path gate: full proof for ${GITHUB_EVENT_NAME}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          is_dogfood_relevant() {
            case "$1" in
              .github/workflows/*) return 0 ;;
              package.json|package-lock.json) return 0 ;;
              packages/*) return 0 ;;
              examples/docs/*) return 0 ;;
              scripts/dogfood-*) return 0 ;;
              scripts/smoke-dogfood*) return 0 ;;
              tests/cycles/DF-*) return 0 ;;
              tests/cycles/*dogfood*) return 0 ;;
              docs/*) return 0 ;;
              docs/design/DF-*) return 0 ;;
              docs/legends/DF-*) return 0 ;;
              docs/method/legends/DF-*) return 0 ;;
            esac

            return 1
          }

          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            diff_args=(HEAD^1 HEAD)
          else
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
            diff_args=(FETCH_HEAD...HEAD)
          fi

          dogfood=false
          while IFS= read -r path; do
            if is_dogfood_relevant "$path"; then
              dogfood=true
            fi
          done < <(git diff --name-only "${diff_args[@]}")

          echo "dogfood=${dogfood}" >> "$GITHUB_OUTPUT"
          echo "DOGFOOD CI path gate: ${dogfood}" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Prepare sealed toolchain
        run: node scripts/docker-seal/bootstrap.mjs --isolated-ci --node-version ${{ matrix.node-version }}
      # Dependency installation and builds happen in disposable Docker workers.
      - run: node scripts/docker-seal/run.mjs --isolated-ci --node-version ${{ matrix.node-version }} -- npm run build
      - run: node scripts/docker-seal/run.mjs --isolated-ci --node-version ${{ matrix.node-version }} -- bash -lc 'npm run build && npm run lint'
      - run: node scripts/docker-seal/run.mjs --isolated-ci --node-version ${{ matrix.node-version }} -- bash -lc 'npm run build && npm run code:size'
      - name: Design-system docs preflight
        if: matrix.node-version == 22
        run: node scripts/docker-seal/run.mjs --isolated-ci -- bash -lc 'npm run build && npm run docs:design-system:preflight'
      - name: Component audit (fails on errors not in the baseline)
        if: matrix.node-version == 22
        run: node scripts/docker-seal/run.mjs --isolated-ci --export audit/component-audit.md -- bash -lc 'npm run build && npm run audit:components -- --all --check'
      - name: Upload component audit report
        if: always() && matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: component-audit
          path: ${{ runner.temp }}/bijou-sealed-evidence/*/exports/audit/component-audit.md
      - name: DOGFOOD coverage gate
        if: matrix.node-version == 22 && needs.changes.outputs.dogfood == 'true'
        run: node scripts/docker-seal/run.mjs --isolated-ci -- bash -lc 'npm run build && npm run dogfood:coverage:gate'
      - name: DOGFOOD i18n policy gate
        if: matrix.node-version == 22 && needs.changes.outputs.dogfood == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
            node scripts/docker-seal/run.mjs --isolated-ci -- bash -lc 'npm run build && npm run dogfood:i18n:complete -- --base FETCH_HEAD && npm run dogfood:i18n:debt -- --base FETCH_HEAD'
          else
            node scripts/docker-seal/run.mjs --isolated-ci -- bash -lc 'npm run build && npm run dogfood:i18n:complete -- --base HEAD^ && npm run dogfood:i18n:debt -- --base HEAD^'
          fi
          node scripts/docker-seal/run.mjs --isolated-ci -- bash -lc 'npm run build && npm run dogfood:i18n:check'

  # The full suite, split across runners (flyingrobots/bijou#907). The suite runs
  # in chunks of files; shard k of N takes every N-th chunk, so the shards
  # partition the suite (scripts/vitest-shards.test.ts). Each shard runs in the
  # sealed runner. scripts/ci-workflow-policy.ts refuses a shard list that is not
  # 1 to N, or a command that names another N.
  suite:
    name: Full test suite (Node ${{ matrix.node-version }}, shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Prepare sealed toolchain
        run: node scripts/docker-seal/bootstrap.mjs --isolated-ci --node-version ${{ matrix.node-version }}
      - name: Full test suite
        run: node scripts/docker-seal/run.mjs --isolated-ci --node-version ${{ matrix.node-version }} -- bash -lc 'npm run build && BIJOU_VITEST_SHARD=${{ matrix.shard }}/4 npm run test:run'

  # Gates that need neither the suite nor the documentation gates, in a job of
  # their own so they run beside them and not after them.
  smoke_gates:
    name: Smoke and type gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Prepare sealed toolchain
        run: node scripts/docker-seal/bootstrap.mjs --isolated-ci --node-version 22
      - name: Smoke interactive examples
        run: node scripts/docker-seal/run.mjs --isolated-ci -- bash -lc 'npm run build && npm run verify:interactive-examples'
      - name: Typecheck tests
        run: node scripts/docker-seal/run.mjs --isolated-ci -- bash -lc 'npm run build && npm run typecheck:test'
      - name: Smoke canary apps
        run: node scripts/docker-seal/run.mjs --isolated-ci -- bash -lc 'npm run build && npm run smoke:canaries -- --skip-build'
      - name: Build and typecheck the web-gpu showcase
        run: node scripts/docker-seal/run.mjs --isolated-ci -- bash -lc 'npm run web-gpu:build && npm run web-gpu:typecheck'

  # The one suite that runs outside the sealed runner: the sealed workers have no
  # browser and no GPU, so the web-gpu showcase runs in the runner's installed
  # Google Chrome. Headless Chrome on a hosted Linux runner draws WebGL2 with
  # SwiftShader (software-probed evidence) and exposes no WebGPU adapter.
  browser_web_gpu:
    name: Browser Suite (web-gpu, Chrome)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Browser version
        run: google-chrome --version
      - name: Run the browser suite
        env:
          CI: "true"
          BIJOU_WEB_GPU_PORT: "41797"
        run: npm run test:browser:web-gpu
      - name: Upload browser suite results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-gpu-browser-results
          path: test-results/web-gpu

  unit_cross_platform:
    name: Focused Unit Tests (${{ matrix.label }}, Node 22)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu
            os: ubuntu-latest
            sealed-runner: run.mjs --isolated-ci
          # The native Windows lane is switched off (2026-11-24): its sealed
          # worker runs out of storage before any test starts
          # (flyingrobots/bijou#788), so it was red on every run and proved
          # nothing. Windows is not verified until it returns; README.md says
          # so. To restore it, add back:
          #   - label: windows
          #     os: windows-2022
          #     sealed-runner: windows.mjs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Prepare sealed toolchain
        run: node scripts/docker-seal/bootstrap.mjs --isolated-ci --node-version 22
      - run: node scripts/docker-seal/${{ matrix.sealed-runner }} -- npm run build
      - run: node scripts/docker-seal/${{ matrix.sealed-runner }} -- node scripts/docker-seal/dispatch.mjs --build -- npm run typecheck:test
      - name: Focused portable unit tests
        run: >-
          node scripts/docker-seal/${{ matrix.sealed-runner }} -- node scripts/docker-seal/dispatch.mjs --build -- npm run test:run -- --run
          packages/bijou-tui/src/eventbus.part01.test.ts
          packages/bijou-tui/src/eventbus.part02.test.ts
          packages/bijou-tui/src/eventbus.part03.test.ts
          packages/bijou-tui/src/eventbus.part04.test.ts
          packages/bijou-tui/src/eventbus.part05.test.ts
          packages/bijou-tui/src/eventbus.part06.test.ts
          packages/bijou-tui/src/eventbus.part07.test.ts
          packages/bijou-tui/src/eventbus.part08.test.ts
          packages/bijou-tui/src/eventbus.part09.test.ts
          packages/bijou-tui/src/pipeline/pipeline.part01.test.ts
          packages/bijou-tui/src/pipeline/pipeline.part02.test.ts
          packages/bijou-node/src/index.part01.test.ts
          packages/bijou-node/src/index.part02.test.ts
          packages/bijou-node/src/index.part03.test.ts
          packages/bijou-node/src/index.part04.test.ts
          packages/bijou-mcp/src/stdio.test.ts
          packages/bijou-mcp/src/tools/hyperlink.test.ts
          packages/bijou-mcp/src/hyperlink-stdio.test.ts
          tests/cycles/WF-166/dependency-security-closeout.test.ts
          scripts/check-node-version.test.ts
          scripts/release-product-witness-files.test.ts
          scripts/release-product-witnesses.test.ts
          scripts/docs-preview-components.part01.test.ts
          scripts/docs-preview-components.part02.test.ts
          scripts/docs-preview-components.part03.test.ts
          scripts/docs-preview-components.part04.test.ts
          scripts/docs-preview-entry.part01.test.ts
          scripts/docs-preview-entry.part02.test.ts
          scripts/docs-preview-entry.part03.test.ts
          scripts/docs-preview-entry.part04.test.ts
          scripts/docs-preview-entry.part05.test.ts
          scripts/docs-preview-landing.part01.test.ts
          scripts/docs-preview-landing.part02.test.ts
          scripts/docs-preview-landing.part03.test.ts
          scripts/docs-preview-landing.part04.test.ts
          scripts/docs-preview-landing.part05.test.ts
          scripts/docs-preview-search.part01.test.ts
          scripts/docs-preview-search.part02.test.ts
          scripts/docs-preview-search.part03.test.ts
          scripts/docs-preview-theme.part01.test.ts
          scripts/workspace-lock.test.ts
          scripts/staged-workspace.test.ts
          scripts/workspace-version-cli.test.ts
          scripts/docs-preview-theme.part02.test.ts
          scripts/docs-preview-theme.part03.test.ts
          scripts/docs-preview-theme.part04.test.ts
          scripts/ci-workflow-policy.test.ts
          scripts/docker-seal/require-docker.test.ts
          scripts/docker-seal/windows-policy.test.ts
          scripts/docker-seal/windows-usage.test.ts
          scripts/docker-seal/windows-quarantine.test.ts
          scripts/docker-seal/windows-extraction.test.ts

  smoke_dogfood:
    name: Smoke DOGFOOD (${{ matrix.lane.label }})
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      matrix:
        lane:
          - label: landing
            command: smoke:dogfood:landing
          - label: docs
            command: smoke:dogfood:docs
    steps:
      - name: Skip unrelated DOGFOOD smoke
        if: needs.changes.outputs.dogfood != 'true'
        run: echo "DOGFOOD smoke skipped because no DOGFOOD-relevant paths changed."

      - uses: actions/checkout@v6
        if: needs.changes.outputs.dogfood == 'true'
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.dogfood == 'true'
        with:
          node-version: "22"
      - name: Prepare sealed toolchain
        if: needs.changes.outputs.dogfood == 'true'
        run: node scripts/docker-seal/bootstrap.mjs --isolated-ci --node-version 22
      - if: needs.changes.outputs.dogfood == 'true'
        run: node scripts/docker-seal/run.mjs --isolated-ci -- bash -lc 'npm run build && npm run ${{ matrix.lane.command }}'

  bench_gradient:
    name: Bench Gradient
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Prepare sealed toolchain
        run: node scripts/docker-seal/bootstrap.mjs --isolated-ci --node-version 22
      - name: Run trusted gradient benchmark lane
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/bijou-bench"
          mkdir -p "$OUT_DIR"
          node scripts/docker-seal/run.mjs --isolated-ci --export audit/gradient-ci.json --export audit/gradient-ci-summary.md -- bash -lc 'npm run build && mkdir -p audit && npm run -s bench:ci:gradient -- --out audit/gradient-ci.json > audit/gradient-ci-summary.md'
          cp "$RUNNER_TEMP"/bijou-sealed-evidence/*/exports/audit/gradient-ci.json "$RUNNER_TEMP"/bijou-sealed-evidence/*/exports/audit/gradient-ci-summary.md "$OUT_DIR/"
          {
            echo '## Gradient Benchmark'
            echo
            echo 'Informational wall-time benchmark lane for the fixed gradient stress scenarios.'
            echo
            cat "$OUT_DIR/gradient-ci-summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-gradient
          path: |
            ${{ runner.temp }}/bijou-bench/gradient-ci.json
            ${{ runner.temp }}/bijou-bench/gradient-ci-summary.md

  wall_time_summary:
    name: Wall time summary
    if: always()
    continue-on-error: true
    needs: [changes, test, suite, smoke_gates, browser_web_gpu, unit_cross_platform, smoke_dogfood, bench_gradient]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Publish per-job wall-time summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-wall-time/publish.mjs
